[package]
name = "gridcraft-agent-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft agent layer UI (fork): the Agent pane, cell badges, heat maps and hover sensitivity"

[lints]
workspace = true

[dependencies]
gridcraft-agent = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
gridcraft-mcp = { workspace = true }

# Voice questions (native only): microphone, local Whisper, pointing markers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-voice = { git = "https://github.com/anton-belkin/craft-voice", rev = "e31b1490399f01ac4564ea8846362950a06d1dd5" }
